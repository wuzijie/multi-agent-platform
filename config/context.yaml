context:
  history:
    # 是否启用多轮上下文注入
    enabled: true
    # 单次注入最多保留的轮数（1 轮 = 用户 + 助手）
    max_turns: 6
    # 单次注入历史的总字符预算（超预算从最旧开始丢弃）
    max_chars: 12000
    # 单条助手消息写入转录时的截断长度
    message_max_chars: 4000
    # 转录超过该长度时触发一次性压缩（会重建一次 KV 缓存）
    compact_threshold: 10000
    # 压缩后保留的轮数
    recent_turns_after_compact: 2
    # 长期记忆按会话冻结（会话内不变，保证 prompt 前缀稳定）
    freeze_memory_per_session: true
    # DAG 规划器注入的压缩历史字符上限
    dag_planner_history_chars: 6000
    # DAG 子任务注入的上一轮结果字符上限
    dag_last_result_chars: 2000

  # ===== 动态上下文投递（@ 转交增量上下文）=====
  # 被 @ 的 agent 收到：来源标识/模式声明/导航头/触发原文/未读历史/系统提示；
  # 未读历史按 delivery_cursor 增量投递，超出预算从最旧开始丢弃。
  delivery:
    # Warm Path 阈值：未读条数 ≤ 且总字符 ≤ 时逐条展开；否则走 Cold Path 简报
    warm_max_msgs: 12
    warm_max_chars: 12000
    # Cold Path 确定性简报的字符上限
    cold_brief_max_chars: 2500
    # 是否用轻量模型生成简报（默认关闭，走零成本确定性简报）
    cold_use_llm: false
    # 未读历史最多占模型输入预算的比例
    budget_ratio: 0.5
    # 模型输入 token 上限默认值（未知 CLI 兜底）
    model_cap_default: 128000
    # token → 字符 的保守估算系数（中文为主）
    chars_per_token: 2
    # 触发消息原文超长时头尾截断（字符数）
    trigger_head_chars: 4000
    trigger_tail_chars: 2000

  # ===== Session 封存 / 恢复（P4）=====
  # 触发：模型输出 [SESSION_HANDOFF]，或 prompt 估算接近模型上限；
  # 产物：tasks/<id>/handoff/ 下的五段式交接笔记 + continuity capsule。
  # 新 session 首轮自动注入最近一份笔记（bootstrap）。
  handoff:
    enabled: true
    # prompt 估算字符数 ≥ 模型上限 × 该比例 时自动封存
    threshold_ratio: 0.8
    # 首轮注入交接笔记的最大字符数
    note_max_chars: 4000
