# @ 触发规则（行首识别，多行）
mention:
  # 用户消息最多允许的 @ 数量（不同智能体，去重后）
  user_max: 2
  # 模型输出最多允许的 @ 数量（每个 agent 最多 @ 2 个其他 agent，不能 @ 自己）
  model_max: 2
  # 两个 @ 的执行方式：parallel（并行回答同一问题）| serial
  mode: parallel
  # 转交链最大跳数
  max_hops: 3
  # 单轮最多 spawn 的 CLI 次数（防爆炸）
  max_spawns_per_turn: 6
  # 模型名别名（除中文名外，允许 @claude / @kimi / @deepseek / @qwen）
  aliases:
    克劳德: ["claude"]
    吉米: ["kimi"]
    迪普斯克: ["deepseek"]
    钱文: ["qwen"]
